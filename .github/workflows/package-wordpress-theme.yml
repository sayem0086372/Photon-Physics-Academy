name: Package WordPress Theme
on:
  push:
    branches:
      - wordpress-migration
      - wordpress-v2-restoration
    paths:
      - 'wp-content/themes/photon-physics-academy/**'
      - 'wp-content/plugins/ppa-academy-core/**'
      - '.github/workflows/package-wordpress-theme.yml'
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package theme and companion plugin
        run: |
          cd wp-content/themes
          zip -r "$GITHUB_WORKSPACE/photon-physics-academy-theme.zip" photon-physics-academy
          cd "$GITHUB_WORKSPACE/wp-content/plugins"
          zip -r "$GITHUB_WORKSPACE/ppa-academy-core-plugin.zip" ppa-academy-core
      - name: Upload installable ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: photon-physics-academy-wordpress-packages
          path: |
            photon-physics-academy-theme.zip
            ppa-academy-core-plugin.zip
          retention-days: 14
